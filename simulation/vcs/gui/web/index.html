<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CMDBUF Studio · 验证工作台</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="formal.css">
</head>
<body>
<aside id="sidebar">
  <a class="brand" href="#" aria-label="CMDBUF Studio 工作台"><span class="brand-mark"><i></i><i></i><i></i></span><span>CMDBUF<span class="brand-sub">VERIFICATION STUDIO</span></span></a>
  <div class="project-card"><div class="project-icon" data-icon="chip"></div><div><strong>CMDBUF RD</strong><small>VCS · SystemVerilog</small></div><span class="project-dot"></span></div>
  <div class="nav-label">工作空间</div>
  <nav id="navigation" aria-label="主导航"></nav>
  <div class="sidebar-bottom"><div id="connection-status"></div><button class="settings-button" id="settings-button"><span data-icon="settings"></span>连接设置<span class="keycap">VM</span></button></div>
</aside>
<div id="shell">
  <header class="topbar"><div class="breadcrumbs">工作空间 <span>/</span> <strong id="breadcrumb">工作台</strong></div><div class="top-actions"><span class="local-badge"><span></span>本地工作空间</span><button class="button" id="compile-button"><span data-icon="compile"></span>编译 DUT</button><button class="button primary" id="run-button"><span data-icon="play"></span>运行回归</button></div></header>
  <main id="main" aria-live="polite"></main>
  <section id="job-panel" class="job-panel hidden" aria-label="任务日志"><button id="job-toggle" class="job-toggle"><span id="job-state"></span><span class="spacer"></span><span id="job-count"></span><span data-icon="chevron"></span></button><div id="job-detail" class="hidden"><div class="job-progress"><div id="job-progress-bar"></div></div><pre id="job-log"></pre></div></section>
  <footer class="statusbar"><span><i></i> CMDBUF Studio <span class="muted">/ 1.0</span></span><span id="footer-context">VCS 仿真 · Verdi 调试</span><span id="clock"></span></footer>
</div>
<div id="toast" role="status"></div>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
<input type="file" id="rtl-files" multiple accept=".sv,.v,.svh,.vh,.f" hidden>
<input type="file" id="rtl-folder" webkitdirectory multiple hidden>
<script src="vendor/codemirror/lib/codemirror.js"></script>
<script src="vendor/codemirror/mode/verilog/verilog.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="vendor/codemirror/addon/comment/comment.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="vendor/codemirror/addon/search/search.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="app.js"></script>
<script src="wave.js"></script>
<script src="formal.js"></script>
</body></html>
